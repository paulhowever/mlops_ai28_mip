[project]
name = "dota-winprob"
version = "0.1.0"
description = "Сервис предсказания вероятности победы команды в матче Dota 2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dota_winprob"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "ASYNC", "B", "BLE", "S", "ANN", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.lint.isort]
known-first-party = ["dota_winprob"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: тесты с настоящим Postgres, нужен INTEGRATION_DATABASE_URL",
]

[tool.coverage.run]
source_pkgs = ["dota_winprob"]

[tool.coverage.report]
fail_under = 85
show_missing = true
