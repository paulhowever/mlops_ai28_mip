name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version-guard:
    name: Сверка версии с тегом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сверить [project].version с именем тега
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$declared" ]; then
            echo "::error::тег v${tag} не совпадает с [project].version = ${declared}"
            exit 1
          fi
          echo "версия ${declared} совпадает с тегом ${GITHUB_REF_NAME}"

  smoke:
    name: Сборка и smoke-тест образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Собрать образ в локальный демон
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dota-winprob:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Поднять контейнер
        run: docker run -d --name smoke -p 8000:8000 dota-winprob:smoke

      - name: Дождаться статуса healthy
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "::error::контейнер не стал healthy"
          exit 1

      - name: Проверить /healthz
        run: |
          body="$(curl -fsS http://127.0.0.1:8000/healthz)"
          echo "$body"
          [ "$(echo "$body" | jq -r .status)" = "ok" ]

      - name: Проверить, что /api/v1/version отдаёт git_sha сборки
        run: |
          body="$(curl -fsS http://127.0.0.1:8000/api/v1/version)"
          echo "$body"
          [ "$(echo "$body" | jq -r .git_sha)" = "${{ github.sha }}" ]
          [ "$(echo "$body" | jq -r .built_at)" = "${{ steps.stamp.outputs.built_at }}" ]

      - name: Проверить, что пакет импортируется
        run: docker exec smoke python -c "import dota_winprob; print(dota_winprob.__version__)"

      - name: Проверить, что процесс не от root
        run: |
          uid="$(docker exec smoke id -u)"
          echo "uid=$uid"
          [ "$uid" -ne 0 ]

      - name: Логи контейнера
        if: always()
        run: docker logs smoke || true

      - name: Убрать контейнер
        if: always()
        run: docker rm -f smoke || true

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Публикация в GHCR
    needs: [version-guard, smoke, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-,format=short
          flavor: latest=auto

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Итог публикации
        run: |
          {
            echo "### Образ опубликован"
            echo
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "**Теги:**"
            echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
