name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TESTED_TAG: tested

jobs:
  version-guard:
    name: Сверка версии с тегом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сверить [project].version с именем тега
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$declared" ]; then
            echo "::error::тег v${tag} не совпадает с [project].version = ${declared}"
            exit 1
          fi
          echo "версия ${declared} совпадает с тегом ${GITHUB_REF_NAME}"

  smoke:
    name: Сборка и smoke-тест образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Собрать образ — единственная сборка за пайплайн
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ env.IMAGE }}:${{ env.TESTED_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Загрузить образ в локальный демон
        run: docker load -i /tmp/image.tar

      - name: Поднять контейнер
        run: docker run -d --name smoke -p 8000:8000 ${{ env.IMAGE }}:${{ env.TESTED_TAG }}

      - name: Дождаться статуса healthy
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "::error::контейнер не стал healthy"
          exit 1

      - name: Проверить /healthz
        run: |
          body="$(curl -fsS http://127.0.0.1:8000/healthz)"
          echo "$body"
          [ "$(echo "$body" | jq -r .status)" = "ok" ]

      - name: Проверить метаданные в /api/v1/version
        run: |
          declared="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          body="$(curl -fsS http://127.0.0.1:8000/api/v1/version)"
          echo "$body"
          [ "$(echo "$body" | jq -r .version)" = "$declared" ]
          [ "$(echo "$body" | jq -r .git_sha)" = "${{ github.sha }}" ]
          [ "$(echo "$body" | jq -r .built_at)" = "${{ steps.stamp.outputs.built_at }}" ]

      - name: Проверить, что пакет импортируется
        run: docker exec smoke python -c "import dota_winprob; print(dota_winprob.__version__)"

      - name: Проверить, что процесс не от root
        run: |
          uid="$(docker exec smoke id -u)"
          echo "uid=$uid"
          [ "$uid" -ne 0 ]

      - name: Логи контейнера
        if: always()
        run: docker logs smoke || true

      - name: Убрать контейнер
        if: always()
        run: docker rm -f smoke || true

      - name: Передать проверенный образ в publish
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: /tmp/image.tar
          retention-days: 1
          compression-level: 0

  ci:
    name: CI
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Публикация в GHCR
    needs: [version-guard, smoke, ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp

      - name: Загрузить проверенный образ
        run: docker load -i /tmp/image.tar

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          flavor: latest=auto

      - id: push
        name: Проставить теги и запушить
        run: |
          : > /tmp/push.log
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "${IMAGE}:${TESTED_TAG}" "$tag"
            docker push "$tag" | tee -a /tmp/push.log
          done <<< "${{ steps.meta.outputs.tags }}"
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' /tmp/push.log | tail -1)"
          [ -n "$digest" ] || { echo "::error::не удалось определить digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Итог публикации
        run: |
          {
            echo "### Образ опубликован"
            echo
            echo "**Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Опубликован ровно тот образ, который прошёл smoke-тест — без пересборки."
            echo
            echo "**Теги:**"
            echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
