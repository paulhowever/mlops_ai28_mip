include:
  - path: observability/compose.yaml

x-app-build: &app-build
  context: .
  args:
    GIT_SHA: ${GIT_SHA:-unknown}
    BUILT_AT: ${BUILT_AT:-unknown}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-pipeline-env: &pipeline-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dota_winprob}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-dota}:${RABBITMQ_PASSWORD:-dota}@rabbitmq:5672/
  QUEUE_MAX_LENGTH: ${QUEUE_MAX_LENGTH:-100}
  DELIVERY_LIMIT: ${DELIVERY_LIMIT:-3}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
  RETRY_DELAY_MS: ${RETRY_DELAY_MS:-1000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  WORKER_PREFETCH: ${WORKER_PREFETCH:-}
  INFERENCE_DELAY_MS: ${INFERENCE_DELAY_MS:-200}
  PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-1.0}

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_RESOURCE_ATTRIBUTES: service.version=${SERVICE_VERSION:-0.1.0},deployment.environment.name=${ENVIRONMENT:-development}

services:
  app:
    build: *app-build
    image: dota-winprob:local
    restart: unless-stopped
    command:
      - sh
      - -c
      - export OTEL_RESOURCE_ATTRIBUTES="$$OTEL_RESOURCE_ATTRIBUTES,service.instance.id=$$(hostname)"; exec uvicorn dota_winprob.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: [*pipeline-env, *otel-env]
      OTEL_SERVICE_NAME: dota-api
      OPENDOTA_BASE_URL: ${OPENDOTA_BASE_URL:-https://api.opendota.com}
      HEALTH_PROBE_TIMEOUT: ${HEALTH_PROBE_TIMEOUT:-3.0}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - observability
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

  worker:
    build: *app-build
    image: dota-winprob:local
    command:
      - sh
      - -c
      - export OTEL_RESOURCE_ATTRIBUTES="$$OTEL_RESOURCE_ATTRIBUTES,service.instance.id=$$(hostname)"; exec uvicorn dota_winprob.worker:app --host 0.0.0.0 --port 8001 --no-access-log
    restart: unless-stopped
    environment:
      <<: [*pipeline-env, *otel-env]
      OTEL_SERVICE_NAME: dota-worker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-dota-winprob}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      MODEL_LOAD_TIMEOUT: ${MODEL_LOAD_TIMEOUT:-30}
      GRACEFUL_TIMEOUT: ${GRACEFUL_TIMEOUT:-30}
    ports:
      - "${WORKER_PORTS:-8101-8104}:8001"
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - backend
      - observability
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

  source:
    build: *app-build
    image: dota-winprob:local
    profiles: ["batch"]
    command:
      - sh
      - -c
      - export OTEL_RESOURCE_ATTRIBUTES="$$OTEL_RESOURCE_ATTRIBUTES,service.instance.id=$$(hostname)"; exec python -m dota_winprob.source --file /app/data/tasks.csv
    restart: "no"
    environment:
      <<: [*pipeline-env, *otel-env]
      OTEL_SERVICE_NAME: dota-source
      SOURCE_BACKOFF_MIN: ${SOURCE_BACKOFF_MIN:-0.02}
      SOURCE_BACKOFF_MAX: ${SOURCE_BACKOFF_MAX:-0.5}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - observability
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dota}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dota}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit collect_statistics_interval 1000
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    expose:
      - "15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
      - observability
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dota_winprob}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-mlflow-db.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MLFLOW_BUCKET:-mlflow}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: mlflow-server:local
    restart: unless-stopped
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mlflow
      - --artifacts-destination
      - s3://${MLFLOW_BUCKET:-mlflow}/
      - --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging: *logging

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:

networks:
  backend:
    driver: bridge
